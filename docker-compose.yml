x-build-defaults: &build-defaults
  context: .
  dockerfile: Dockerfile.base

x-service-defaults: &service-defaults
  restart: unless-stopped
  environment:
    LOCAL_DEVELOPMENT_ENABLED: ${LOCAL_DEVELOPMENT_ENABLED:-false}
    LOCAL_DEVELOPMENT_ROOT: /workspace/.localdev
  deploy:
    resources:
      limits:
        cpus: "1.5"
        memory: 2G
      reservations:
        cpus: "0.5"
        memory: 512M
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - ecad-network

# Convenção de profiles:
#   infra = apenas infra-estrutura (mongodb, azurite, kafka) — útil para desenvolvimento local
#           onde os servicos Java rodam no host via mvndw/IDE, conectando em localhost.
#   full  = infra-estrutura + servicos ECAD (build Docker). Uso:
#             docker compose --profile full up --build
#   omitir profile sobe SOMENTE os servicos ECAD (assume que a infra ja esta de pe
#           em outro compose/ambiente, ex. Azurite/Cosmos/Event Hubs em nuvem).
x-infra-depends: &infra-depends
  depends_on:
    mongodb:
      condition: service_healthy
    azurite:
      condition: service_healthy
    kafka:
      condition: service_healthy

# Variáveis de ambiente comuns a todos os serviços ECAD (cloud mode)
# Usadas via merge YAML: environment: [*common-env, ...service-specific]
x-common-env: &common-env
  LOCAL_DEVELOPMENT_ENABLED: ${LOCAL_DEVELOPMENT_ENABLED:-false}
  LOCAL_DEVELOPMENT_ROOT: /workspace/.localdev
  MONGODB_CONNECTION_STRING: ${MONGODB_CONNECTION_STRING:-mongodb://mongodb:27017}
  MONGODB_DATABASE_NAME: ${MONGODB_DATABASE_NAME:-ecad-captacao}
  AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
  AZURE_BLOB_CONTAINER_NAME: ${AZURE_BLOB_CONTAINER_NAME:-captura-documentos}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  KAFKA_SCRAPING_COMMANDS_TOPIC: ${KAFKA_SCRAPING_COMMANDS_TOPIC:-scraping_commands}
  KAFKA_CAPTURED_DOCUMENTS_TOPIC: ${KAFKA_CAPTURED_DOCUMENTS_TOPIC:-captured_documents}
  KAFKA_MAX_POLL_INTERVAL_MS: ${KAFKA_MAX_POLL_INTERVAL_MS:-3600000}
  KAFKA_MAX_POLL_RECORDS: ${KAFKA_MAX_POLL_RECORDS:-1}

networks:
  ecad-network:
    driver: bridge
    # Nome dinâmico baseado no project name para evitar conflitos entre múltiplos stacks
    name: ${COMPOSE_PROJECT_NAME:-ecad}-network

services:
  # Infraestrutura open-source (substitui Azure Cosmos / Blob / Event Hubs)
  mongodb:
    image: mongo:7.0
    profiles: ["infra", "full"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ecad-captacao
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - ecad-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.32.0
    profiles: ["infra", "full"]
    restart: unless-stopped
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --loose --skipApiVersionCheck
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 && nc -z 127.0.0.1 10001 && nc -z 127.0.0.1 10002 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ecad-network

  kafka:
    image: apache/kafka:3.7.0
    profiles: ["infra", "full"]
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - kafka-data:/tmp/kafka-logs
    environment:
      # Configuração KRaft (sem ZooKeeper) — variáveis prefixadas com KAFKA_
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-nmFuLQEznkGwNNNgTOktfQ}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Listener INTERNAL para serviços dentro da rede Docker; EXTERNAL para o host
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      # Single-node KRaft: replication factor 1 (default é 3) para que
      # __consumer_offsets e __transaction_state consigam ser criados.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - ecad-network
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Init container: corrige permissões do volume kafka-data para uid 1000 (appuser)
  kafka-init:
    image: alpine:3.19
    profiles: ["infra", "full"]
    volumes:
      - kafka-data:/data
    command: chown 1000:1000 /data
    networks:
      - ecad-network


  # Serviços ECAD — sobem juntos via profile "full" (infra + servicos),
  # ou isoladamente em modo cloud contra infra externa (sem profile).
  control-center:
    <<: [*service-defaults, *infra-depends]
    profiles: ["full"]
    build:
      <<: *build-defaults
      dockerfile: ecad-control-center/Dockerfile
    environment:
      <<: *common-env
      SGA_VERIFICATION_ENABLED: ${SGA_VERIFICATION_ENABLED:-false}
      CONTROL_CENTER_SCHEDULING_ENABLED: ${CONTROL_CENTER_SCHEDULING_ENABLED:-true}
      AGENDAMENTO_INTERVAL_MS: ${AGENDAMENTO_INTERVAL_MS:-60000}
    volumes:
      - ./.localdev:/workspace/.localdev
    ports:
      - "8080:8080"

  processing-engine:
    <<: [*service-defaults, *infra-depends]
    profiles: ["full"]
    build:
      <<: *build-defaults
      dockerfile: ecad-processing-engine/Dockerfile
    environment:
      <<: *common-env
      KAFKA_CONSUMER_GROUP: ${PROCESSING_ENGINE_CONSUMER_GROUP:-cg-processing-engine}
      SGA_VERIFICATION_ENABLED: ${SGA_VERIFICATION_ENABLED:-false}
      AI_PROVIDER_CHAIN: ${AI_PROVIDER_CHAIN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
    volumes:
      - ./.localdev:/workspace/.localdev
    ports:
      - "8081:8080"

  # OLLAMA_BASE_URL aponta para host.docker.internal para usar Ollama do host
  document-scraper:
    <<: [*service-defaults, *infra-depends]
    profiles: ["full"]
    build:
      <<: *build-defaults
      dockerfile: ecad-document-scraper/Dockerfile
    environment:
      <<: *common-env
      KAFKA_CONSUMER_GROUP: ${DOCUMENT_SCRAPER_CONSUMER_GROUP:-cg-document-scraper}
      AI_PROVIDER_CHAIN: ${AI_PROVIDER_CHAIN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-glm-ocr:latest}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
    volumes:
      - ./.localdev:/workspace/.localdev

  sga-status-sync:
    <<: [*service-defaults, *infra-depends]
    profiles: ["full"]
    build:
      <<: *build-defaults
      dockerfile: ecad-sga-status-sync/Dockerfile
    environment:
      <<: *common-env
      SGA_VERIFICATION_ENABLED: ${SGA_VERIFICATION_ENABLED:-false}
      SGA_OAUTH_URL: ${SGA_OAUTH_URL:-https://api-prd.ecad.org.br/oauth-rfc/v1/access-token}
      SGA_BASE_URL: ${SGA_BASE_URL:-https://backend.ecad.org.br/arrecadacao/api-show}
      SGA_CLIENT_ID: ${SGA_CLIENT_ID}
      SGA_CLIENT_SECRET: ${SGA_CLIENT_SECRET}
      SGA_USER: ${SGA_USER}
      SGA_TIMEOUT_SECONDS: ${SGA_TIMEOUT_SECONDS:-10}
      SGA_MAX_RETRIES: ${SGA_MAX_RETRIES:-3}
    volumes:
      - ./.localdev:/workspace/.localdev

  deduplicator:
    <<: [*service-defaults, *infra-depends]
    profiles: ["tools"]
    build:
      <<: *build-defaults
      dockerfile: ecad-deduplicator/Dockerfile
    environment:
      <<: *common-env
    volumes:
      - ./.localdev/data:/workspace/.localdev/data
    command:
      - --input
      - /workspace/.localdev/data/eventos.json
      - --dry-run
      - --no-ai
    networks:
      - ecad-network

  log-analyser:
    <<: [*service-defaults, *infra-depends]
    environment:
      <<: *common-env
    profiles: ["tools"]
    build:
      <<: *build-defaults
      dockerfile: ecad-log-analyser/Dockerfile
    volumes:
      - ./.localdev/data:/workspace/.localdev/data:ro
      - ./.artifacts/log-analysis:/workspace/output
    command:
      - --input-dir
      - /workspace/.localdev/data
      - --output
      - /workspace/output/Analise-Telemetria-ECAD-docker.xlsx
    networks:
      - ecad-network

volumes:
  mongo-data:
  azurite-data:
  kafka-data:
